name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheel for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: true
          # Linux, musl: Alpine and the images built on it.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - os: macos-14
            target: aarch64-apple-darwin
            zig: false
          - os: macos-14
            target: x86_64-apple-darwin
            zig: false
          # Windows. The runner is x86_64; the ARM64 wheel is cross-compiled.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            zig: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
        if: matrix.zig

      - name: Install maturin
        run: pip install maturin
        shell: bash

      - name: Build wheel
        run: |
          cd pyspart
          maturin build --release --target ${{ matrix.target }} ${{ matrix.zig && '--zig' || '' }} --out dist
        shell: bash

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: pyspart/dist/*.whl
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        run: |
          cd pyspart
          maturin sdist --out dist

      - name: Check the sdist builds and imports from source
        run: |
          python -m venv /tmp/sdist-check
          /tmp/sdist-check/bin/pip install --upgrade pip
          /tmp/sdist-check/bin/pip install pyspart/dist/*.tar.gz
          /tmp/sdist-check/bin/python -c "
          import pyspart as ps
          boundary = {'x': 0.0, 'y': 0.0, 'width': 100.0, 'height': 100.0}
          tree = ps.Quadtree(boundary, 4)
          tree.insert(ps.Point2D(10.0, 10.0, 'a'))
          assert len(tree) == 1
          assert len(tree.range_search_bbox(boundary)) == 1
          print('sdist builds and imports')
          "

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: pyspart/dist/*.tar.gz
          if-no-files-found: error

  publish_to_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install twine
        run: pip install twine

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify the distributions
        run: |
          ls -la dist/
          twine check dist/*
          # Every platform files and the sdist has to be present, or a release would silently ship only
          # part of the set.
          count=$(ls -1 dist/*.whl | wc -l)
          test "$count" -eq 8 || { echo "expected 8 wheels, found $count"; exit 1; }
          test -n "$(ls -1 dist/*.tar.gz 2>/dev/null)" || { echo "no sdist found"; exit 1; }

      - name: Publish to PyPI
        run: twine upload dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}
