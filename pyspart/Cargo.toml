[package]
name = "pyspart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "pyspart"
crate-type = ["cdylib"]
doc = false

[dependencies]
pyo3 = { version = "=0.29.0", features = ["abi3-py310", "extension-module", "auto-initialize", "serde", "generate-import-lib"] }
spart = { path = "..", features = ["serde"] }
serde = { version = "1.0.209", features = ["derive"] }
bincode = "=1.3.3"
